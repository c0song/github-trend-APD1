name: Daily Tech Trend

on:
  schedule:
    # 평일 07:10 KST (UTC 22:10) — GitHub cron 지연(1.5~4h 변동)이 있어도 점심 전에 기동하도록
    # 미리 띄우고, 아래 대기 스텝에서 KST 12:05까지 hold 후 전송.
    # GitHub cron은 UTC 기준이라 전날로 지정하므로 요일은 일~목(0-4)
    - cron: '10 22 * * 0-4'
  workflow_dispatch:
    inputs:
      trend_category:
        description: '테마 강제 지정 (agents/frontend/backend/ml/llm/all) — 비우면 오늘 요일 테마'
        required: false
        default: ''
      dry_run:
        description: 'true면 채널에 전송하지 않고 메시지 미리보기만 출력'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: 점심시간(KST 12:05)까지 대기
        if: github.event_name == 'schedule'
        run: |
          TARGET=$(TZ=Asia/Seoul date -d "today 12:05" +%s)
          NOW=$(date +%s)
          WAIT=$((TARGET - NOW))
          if [ "$WAIT" -gt 0 ]; then
            echo "KST 12:05까지 ${WAIT}초 대기합니다"
            sleep "$WAIT"
          else
            echo "이미 KST 12:05가 지나 ${WAIT}초 늦게 기동됨 — 즉시 전송합니다"
          fi

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 봇 실행
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_CATEGORY: ${{ inputs.trend_category }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        run: python src/main.py
