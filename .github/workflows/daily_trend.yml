name: Daily Tech Trend

on:
  schedule:
    # 평일 12:00 KST (UTC 03:00)
    - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      trend_category:
        description: '테마 강제 지정 (agents/frontend/backend/ml/llm/all) — 비우면 오늘 요일 테마'
        required: false
        default: ''
      dry_run:
        description: 'true면 채널에 전송하지 않고 메시지 미리보기만 출력'
        required: false
        default: 'false'

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v3

      - name: Python 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 봇 실행
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TREND_CATEGORY: ${{ inputs.trend_category }}
          DRY_RUN: ${{ inputs.dry_run == 'true' && '1' || '' }}
        run: python src/main.py
